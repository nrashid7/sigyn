name: CI

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Type-check
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Lint
        run: |
          set -euo pipefail
          npm run lint

      - name: Test
        run: |
          set -euo pipefail
          npm run test:node

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check edge functions
        run: |
          set -euo pipefail
          deno check --no-check=remote supabase/functions/*/index.ts

      - name: Deno tests
        run: |
          set -euo pipefail
          deno test --allow-env --allow-read supabase/functions/tests
